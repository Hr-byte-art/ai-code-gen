spring:
  application:
    name: ai-code-gen-backend
  profiles:
    active: prod
  session:
    store-type: redis
    timeout: 2592000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: GMT+8
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.wjh.aicodegen.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sessions
# https://docs.spring.io/spring-boot/reference/actuator/endpoints.html 访问可以看看 spring 支持开放的 endpoint
  endpoint:
    health:
      show-details: always

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wjh.aicodegen.observability.model
# 设计模板配置
design:
  template:
    dir: design-templates/design-md
# 多 Agent 配置（默认值）
agent:
  review:
    # base-url: https://api.deepseek.com
    # model-name: deepseek-chat
    max-tokens: 4096
    temperature: 0.3
    base-url: https://api.deepseek.com
    api-key: sk-02e5cc8d4d9346fdae531cd4fbbae152
    model-name: deepseek-v4-flash
  optimizer:
    # base-url: https://api.deepseek.com
    # model-name: deepseek-chat
    max-tokens: 8192
    temperature: 0.5
    base-url: https://api.deepseek.com
    api-key: sk-02e5cc8d4d9346fdae531cd4fbbae152
    model-name: deepseek-v4-flash
langchain4j:
  open-ai:
    chat-model:
      log-requests: false
      log-responses: false